<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pantau aktivitas — Virtual Run</title><link rel="stylesheet" href="/styles.css"></head><body><header><nav class="wrap nav"><a class="brand" href="/">🏃 LangkahBersama</a><a href="/admin">Admin</a></nav></header><main class="wrap section"><div class="panel"><p class="eyebrow">PANTAU AKTIVITAS</p><h1 id="heading">Aktivitas lari</h1><p id="info" class="muted">Memuat data tiket…</p><div id="tools" hidden><div class="actions" id="strava"></div><h2>Kirim bukti aktivitas</h2><form id="uploadForm"><label>File JPG, PNG, atau PDF (maksimal 8 MB)<input name="proof" type="file" accept="image/jpeg,image/png,application/pdf" required></label><button class="button">Unggah bukti</button><p id="uploadMessage" role="status"></p></form><h2>Aktivitas tercatat</h2><div id="activities"></div></div></div></main><script>
const code=location.pathname.split('/').filter(Boolean).pop();const info=document.querySelector('#info'),tools=document.querySelector('#tools');async function load(){try{const r=await fetch('/api/track/'+encodeURIComponent(code));const d=await r.json();if(!r.ok)throw Error(d.error);document.querySelector('#heading').textContent=`Halo, ${d.name}`;info.textContent=`${d.event_name} · ${d.distance} · ${d.start_date}—${d.end_date}`;tools.hidden=false;const strava=document.querySelector('#strava');if(d.stravaConfigured){const link=document.createElement('a');link.className='button';link.href='/api/strava/connect/'+encodeURIComponent(code);link.textContent='Hubungkan Strava';strava.append(link);const sync=document.createElement('button');sync.className='button secondary';sync.textContent='Sinkronkan aktivitas';sync.onclick=async()=>{sync.disabled=true;try{const x=await fetch('/api/strava/sync/'+encodeURIComponent(code),{method:'POST'});const j=await x.json();if(!x.ok)throw Error(j.error);alert(`Aktivitas baru diimpor: ${j.imported}`);await load()}catch(e){alert(e.message)}finally{sync.disabled=false}};strava.append(sync)}if(location.search.includes('strava=connected'))info.textContent+=' · Strava berhasil dihubungkan.';const list=document.querySelector('#activities');list.innerHTML='';if(!d.activities.length)list.textContent='Belum ada aktivitas terkirim.';for(const a of d.activities){const row=document.createElement('article');row.className='activity';const distance=a.distance_m?`${(a.distance_m/1000).toFixed(2)} km`:'Bukti unggahan';row.textContent=`${a.source==='strava'?'Strava':'Unggahan'} · ${distance} · ${a.status} · ${a.activity_date||''}`;list.append(row)}}catch(e){info.textContent=e.message}}
document.querySelector('#uploadForm').addEventListener('submit',async e=>{e.preventDefault();const m=document.querySelector('#uploadMessage');try{const r=await fetch('/api/track/'+encodeURIComponent(code)+'/upload',{method:'POST',body:new FormData(e.currentTarget)});const d=await r.json();if(!r.ok)throw Error(d.error);m.textContent=d.message;e.currentTarget.reset();await load()}catch(err){m.textContent=err.message}});load();</script></body></html>
