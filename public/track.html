<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pantau aktivitas — Virtual Run</title><link rel="stylesheet" href="/styles.css"></head>
<body><header><nav class="wrap nav"><a class="brand" href="/">🏃 LangkahBersama</a><a href="/admin">Admin</a></nav></header>
<main class="wrap section"><div class="panel"><p class="eyebrow">PANTAU AKTIVITAS</p><h1 id="heading">Aktivitas lari</h1><p id="info" class="muted">Memuat data tiket…</p>
<section id="access" hidden><h2>Verifikasi peserta</h2><p>Untuk melindungi data aktivitas, kami mengirim tautan akses sekali pakai ke email yang digunakan saat mendaftar.</p><form id="accessForm"><label>Kode tiket<input id="ticketCode" required autocomplete="off"></label><label>Email pendaftaran<input id="participantEmail" type="email" required autocomplete="email"></label><button class="button">Kirim tautan verifikasi</button><p id="accessMessage" role="status"></p></form></section>
<div id="tools" hidden><button class="button secondary" id="logout">Keluar dari pantauan</button><div class="actions" id="strava"></div><h2>Kirim bukti aktivitas</h2><form id="uploadForm"><label>File JPG, PNG, atau PDF (maksimal 8 MB)<input name="proof" type="file" accept="image/jpeg,image/png,application/pdf" required></label><button class="button">Unggah bukti</button><p id="uploadMessage" role="status"></p></form><h2>Aktivitas tercatat</h2><div id="activities"></div></div></div></main>
<script>
const code=location.pathname.split('/').filter(Boolean).pop(),info=document.querySelector('#info'),tools=document.querySelector('#tools'),access=document.querySelector('#access');document.querySelector('#ticketCode').value=code;
async function load(){try{const r=await fetch('/api/track/'+encodeURIComponent(code)),d=await r.json();if(r.status===401){access.hidden=false;tools.hidden=true;info.textContent='Verifikasi email peserta diperlukan untuk melihat atau mengirim aktivitas.';return}if(!r.ok)throw Error(d.error);access.hidden=true;tools.hidden=false;document.querySelector('#heading').textContent=`Halo, ${d.name}`;info.textContent=`${d.event_name} · ${d.distance} · ${d.start_date}—${d.end_date}`;const strava=document.querySelector('#strava');strava.innerHTML='';if(d.stravaConfigured){const link=document.createElement('a');link.className='button';link.href='/api/strava/connect/'+encodeURIComponent(code);link.textContent='Hubungkan Strava';strava.append(link);const sync=document.createElement('button');sync.className='button secondary';sync.textContent='Sinkronkan aktivitas';sync.onclick=async()=>{sync.disabled=true;try{const x=await fetch('/api/strava/sync/'+encodeURIComponent(code),{method:'POST'}),j=await x.json();if(!x.ok)throw Error(j.error);alert(`Aktivitas baru diimpor: ${j.imported}`);await load()}catch(e){alert(e.message)}finally{sync.disabled=false}};strava.append(sync)}if(location.search.includes('strava=connected'))info.textContent+=' · Strava berhasil dihubungkan.';const list=document.querySelector('#activities');list.innerHTML='';if(!d.activities.length)list.textContent='Belum ada aktivitas terkirim.';for(const a of d.activities){const row=document.createElement('article');row.className='activity';row.textContent=`${a.source==='strava'?'Strava':'Unggahan'} · ${a.distance_m?`${(a.distance_m/1000).toFixed(2)} km`:'Bukti unggahan'} · ${a.status} · ${a.activity_date||''}`;list.append(row)}}catch(e){info.textContent=e.message}}
document.querySelector('#accessForm').addEventListener('submit',async e=>{e.preventDefault();const m=document.querySelector('#accessMessage');try{const r=await fetch('/api/track/request-access',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:document.querySelector('#ticketCode').value,email:document.querySelector('#participantEmail').value})}),d=await r.json();if(!r.ok)throw Error(d.error);m.textContent=d.message}catch(err){m.textContent=err.message}});
document.querySelector('#uploadForm').addEventListener('submit',async e=>{e.preventDefault();const m=document.querySelector('#uploadMessage');try{const r=await fetch('/api/track/'+encodeURIComponent(code)+'/upload',{method:'POST',body:new FormData(e.currentTarget)}),d=await r.json();if(!r.ok)throw Error(d.error);m.textContent=d.message;e.currentTarget.reset();await load()}catch(err){m.textContent=err.message}});
document.querySelector('#logout').addEventListener('click',async()=>{await fetch('/api/track/'+encodeURIComponent(code)+'/logout',{method:'POST'});tools.hidden=true;access.hidden=false;info.textContent='Anda sudah keluar dari pantauan.'});load();
</script></body></html>
