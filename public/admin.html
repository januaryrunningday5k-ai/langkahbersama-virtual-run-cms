<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CMS Admin — Virtual Run</title><link rel="stylesheet" href="/styles.css"></head><body><header><nav class="wrap nav"><a class="brand" href="/">🏃 Virtual Run CMS</a><span id="navRight"></span></nav></header><main class="wrap section"><div id="login" class="panel narrow"><p class="eyebrow">ADMIN CMS</p><h1>Masuk</h1><form id="loginForm"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Kata sandi<input name="password" type="password" required autocomplete="current-password"></label><button class="button">Masuk</button><p id="loginMessage" role="status"></p></form></div><div id="dashboard" hidden><div class="admin-head"><div><p class="eyebrow">PANEL PENGELOLAAN</p><h1>Dashboard event</h1></div><button id="logout" class="button secondary">Keluar</button></div><div class="tabs"><button data-tab="events" class="active">Event</button><button data-tab="registrations">Pendaftar</button><button data-tab="activities">Aktivitas</button></div><section id="eventsTab" class="panel"><h2>Tambah event</h2><form id="eventForm" class="form-grid"><label>Nama event<input name="name" required maxlength="120"></label><label>Slug (opsional)<input name="slug" placeholder="otomatis-dari-nama"></label><label>Mulai<input name="start_date" type="date" required></label><label>Selesai<input name="end_date" type="date" required></label><label>Batas pendaftaran<input name="registration_deadline" type="date" required></label><label>Harga kategori (format Jarak=Harga, pisahkan koma)<input name="prices" value="3K=99000,5K=139000,10K=179000" required></label><label class="wide">Deskripsi<textarea name="description" rows="3"></textarea></label><button class="button">Buat event</button><p id="eventMessage" role="status"></p></form><h2>Semua event</h2><div id="eventsList"></div></section><section id="registrationsTab" class="panel" hidden><h2>Pendaftar (maks. 1.000 terakhir)</h2><div class="table-scroll"><table><thead><tr><th>Kode</th><th>Nama / email</th><th>Event</th><th>Jarak</th><th>Biaya</th><th>Status</th><th>Aktivitas</th><th>Tiket email</th></tr></thead><tbody id="registrationsList"></tbody></table></div></section><section id="activitiesTab" class="panel" hidden><h2>Pantauan aktivitas</h2><div id="activitiesList"></div></section></div></main><script>
const login=document.querySelector('#login'),dashboard=document.querySelector('#dashboard');async function api(url,options={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Permintaan gagal');return d}function money(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n)}
async function show(){try{await api('/api/admin/me');login.hidden=true;dashboard.hidden=false;document.querySelector('#navRight').textContent='Admin';await Promise.all([loadEvents(),loadRegistrations(),loadActivities()])}catch{login.hidden=false;dashboard.hidden=true}}async function loadEvents(){const es=await api('/api/admin/events'),box=document.querySelector('#eventsList');box.innerHTML='';for(const e of es){const row=document.createElement('article');row.className='event-row';const info=document.createElement('div');info.innerHTML=`<strong></strong><div class="small muted"></div><div class="small"></div>`;info.querySelector('strong').textContent=e.name;info.children[1].textContent=`${e.start_date} — ${e.end_date} · /${e.slug}`;info.children[2].textContent=Object.entries(e.distances).map(([k,v])=>`${k} ${money(v)}`).join(' · ');const button=document.createElement('button');button.className='button '+(e.active?'':'secondary');button.textContent=e.active?'Aktif':'Jadikan aktif';button.disabled=e.active;button.onclick=async()=>{await api(`/api/admin/events/${e.id}/activate`,{method:'POST'});await loadEvents()};row.append(info,button);box.append(row)}}async function loadRegistrations(){const rows=await api('/api/admin/registrations'),body=document.querySelector('#registrationsList');body.innerHTML='';for(const x of rows){const tr=document.createElement('tr');for(const value of [x.code,`${x.name}\n${x.email}`,x.event_name,x.distance,money(x.amount),x.status,String(x.activity_count),x.ticket_sent_at||'—']){const td=document.createElement('td');td.textContent=value;tr.append(td)}body.append(tr)}}async function loadActivities(){const rows=await api('/api/admin/activities'),box=document.querySelector('#activitiesList');box.innerHTML='';if(!rows.length)box.textContent='Belum ada aktivitas.';for(const a of rows){const row=document.createElement('article');row.className='activity';const text=document.createElement('span');text.textContent=`${a.name} · ${a.event_name} · ${a.source} · ${a.distance_m?`${(a.distance_m/1000).toFixed(2)} km`:'bukti'} · ${a.status}`;row.append(text);if(a.proof_path){const link=document.createElement('a');link.href=`/uploads/${encodeURIComponent(a.proof_path)}`;link.textContent='Lihat bukti';link.target='_blank';row.append(link)}for(const status of ['approved','rejected']){const b=document.createElement('button');b.className='button tiny secondary';b.textContent=status==='approved'?'Setujui':'Tolak';b.onclick=async()=>{await api(`/api/admin/activities/${a.id}`,{method:'PATCH',body:JSON.stringify({status})});await loadActivities()};row.append(b)}box.append(row)}}
document.querySelector('#loginForm').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.currentTarget));try{await api('/api/admin/login',{method:'POST',body:JSON.stringify(f)});await show()}catch(err){document.querySelector('#loginMessage').textContent=err.message}};document.querySelector('#logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'});show()};document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));for(const tab of ['events','registrations','activities'])document.querySelector(`#${tab}Tab`).hidden=tab!==b.dataset.tab});document.querySelector('#eventForm').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.currentTarget));const distances={};for(const part of f.prices.split(',')){const [k,v]=part.trim().split('=');if(k&&v)distances[k.trim()]=Number(v.trim())}try{await api('/api/admin/events',{method:'POST',body:JSON.stringify({...f,distances})});document.querySelector('#eventMessage').textContent='Event dibuat. Aktifkan untuk menerima pendaftaran.';e.currentTarget.reset();await loadEvents()}catch(err){document.querySelector('#eventMessage').textContent=err.message}};show();
</script></body></html>
