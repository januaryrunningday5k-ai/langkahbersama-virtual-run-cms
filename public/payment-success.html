<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Status pembayaran — Virtual Run</title><link rel="stylesheet" href="/styles.css"></head><body><main class="wrap section"><div class="panel"><p class="eyebrow">PEMBAYARAN</p><h1 id="title">Memeriksa status…</h1><p id="message" class="muted">Konfirmasi akhir dilakukan melalui notifikasi aman dari penyedia pembayaran.</p><a class="button" href="/">Kembali ke event</a></div></main><script>const id=new URLSearchParams(location.search).get('session_id');(async()=>{if(!id){document.querySelector('#title').textContent='Sesi tidak ditemukan';return}try{const r=await fetch('/api/payment-status?session_id='+encodeURIComponent(id));const d=await r.json();if(d.paid){document.querySelector('#title').textContent='Pembayaran berhasil';document.querySelector('#message').textContent='Tiket PDF akan segera dikirim ke email pendaftaran setelah webhook pembayaran diproses.'}else{document.querySelector('#title').textContent='Pembayaran belum terkonfirmasi';document.querySelector('#message').textContent='Silakan tunggu sebentar atau cek email. Jangan membayar ulang bila transaksi masih diproses.'}}catch{document.querySelector('#title').textContent='Status sedang diproses'}})();</script></body></html>
