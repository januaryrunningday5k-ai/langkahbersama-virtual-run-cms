services:
  virtual-run-cms:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_FILE: /data/cms.db
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - cms-data:/data
      - cms-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  cms-data:
  cms-uploads:
